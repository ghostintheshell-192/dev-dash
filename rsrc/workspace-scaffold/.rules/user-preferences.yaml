# User Preferences - Customize Claude behavior
# This file controls how Claude behaves during project work

project_initialization:
  # How to handle missing mandatory files
  # Options: "auto" (generate automatically), "ask" (ask for confirmation), "manual" (wait for /init command)
  mode: "ask"
  
  # Files to generate during project initialization
  files:
    - "CLAUDE.md"
    - "README.md"
    - ".gitignore"
    - "LICENSE"
  
  # Whether to backup existing files before overwriting
  backup_existing: true

workflow_preferences:
  # Automatically update projects.yaml before starting work
  auto_update_projects: true

  # Show detailed information about which standards are being loaded
  verbose_standards_loading: false

  # Suggest new conversation when context becomes too complex
  suggest_context_reset: false

  # Maximum number of projects to track in projects.yaml (0 = no limit)
  max_tracked_projects: 0

preflight_checks:
  # Enable pre-flight checks before code modifications
  enabled: true

  # Individual checks configuration
  checks:
    git_initialized: true        # Verify git repository exists
    current_branch: true          # Check not on main branch
    uncommitted_changes: "warn"   # "warn" | "block" | "ignore"
    remote_configured: "info"     # "info" | "warn" | "ignore"
    untracked_files: "info"       # Notify important untracked files

  # Automatic actions
  auto_create_feature_branch: true      # If on main, create feature branch automatically
  auto_branch_naming: "feature/{task}"  # Branch naming pattern
  check_existing_branch: true           # Check if appropriate branch already exists

  # When to run pre-flight checks
  run_on:
    - "code_modifications"       # Tasks that modify code
    - "explicit_work_request"    # User says "work on...", "implement..."

  skip_on:
    - "read_only"                # Exploring, reading, explaining
    - "already_in_feature"       # Already on feature branch

# Future preferences can be added here
